name: Build Kalon AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
defaults:
  run:
    working-directory: kalon-project
env:
  APP_VERSION_NAME: "1.7.0.0"
  VERSION_CODE_OFFSET: "100"
  # minSdk 22 = Android 5.1 — значение по умолчанию для Capacitor 6.
  # ВАЖНО: с ним собирался прежний релиз. Подъём до 24 отрезает Android 5.1 и 6.0
  # (~19 000 моделей) и вызывает предупреждение Play о потере устройств.
  # Приложение защищено проверкой WebView: на слишком старом движке
  # вместо белого экрана показывается просьба обновить WebView.
  MIN_SDK: "22"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Install R2 plugins (notifications)
        run: |
          # Версия плагина ДОЛЖНА совпадать с мажорной версией @capacitor/core,
          # иначе npm падает с ERESOLVE (у core@6 плагин@8 требует core>=8).
          CAPVER=$(node -p "require('./node_modules/@capacitor/core/package.json').version" 2>/dev/null || echo "")
          if [ -z "$CAPVER" ]; then
            CAPVER=$(node -p "((require('./package.json').dependencies||{})['@capacitor/core']||'6.0.0').replace(/^[^0-9]*/,'')" 2>/dev/null || echo "6.0.0")
          fi
          MAJ=$(echo "$CAPVER" | cut -d. -f1)
          if [ -z "$MAJ" ] || [ "$MAJ" -lt 5 ] 2>/dev/null; then MAJ=6; fi
          echo "Capacitor core: $CAPVER  ->  ставим плагины ^${MAJ}.0.0"
          npm install "@capacitor/local-notifications@^${MAJ}.0.0" --save
          npm install "@capacitor/preferences@^${MAJ}.0.0" --save || echo "preferences already present"
          echo "=== установленные версии ==="
          node -p "JSON.stringify({core:require('./node_modules/@capacitor/core/package.json').version, ln:require('./node_modules/@capacitor/local-notifications/package.json').version, prefs:(()=>{try{return require('./node_modules/@capacitor/preferences/package.json').version}catch(e){return 'нет'}})()},null,1)"

      - name: Add Android platform
        run: npx cap add android || echo "android platform already exists"
      - name: Fix targetSdk, minSdk and bump versionCode
        run: |
          if [ -f android/variables.gradle ]; then
            # Android 16 (API 36) — требование Google Play c 31.08.2026
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' android/variables.gradle
            sed -i "s/minSdkVersion = [0-9]*/minSdkVersion = ${{ env.MIN_SDK }}/g" android/variables.gradle
            echo "=== ИТОГОВЫЕ SDK ==="
            grep -E "minSdkVersion|targetSdkVersion|compileSdkVersion" android/variables.gradle
          fi
          VC=$(( ${{ github.run_number }} + ${{ env.VERSION_CODE_OFFSET }} ))
          echo "Computed versionCode = $VC"
          sed -i "s/versionCode [0-9]*/versionCode $VC/g" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ env.APP_VERSION_NAME }}\"/g" android/app/build.gradle
          echo "=== build.gradle after version bump ==="
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Inject AdMob App ID into manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            echo "AdMob App ID meta-data already present, skipping."
          else
            sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1788139495634661~5741433334"/>\n    </application>#' "$MANIFEST"
            echo "=== AdMob App ID injected ==="
          fi
          grep -n "APPLICATION_ID" "$MANIFEST" || echo "WARNING: meta-data not found"
      - name: Add camera permission (barcode scanner)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" */>#&\n    <uses-permission android:name="android.permission.CAMERA" />#' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' "$MANIFEST"
          fi
          if ! grep -q 'android.hardware.camera' "$MANIFEST"; then
            sed -i 's#<uses-permission android:name="android.permission.CAMERA" */>#&\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.any" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />#' "$MANIFEST"
          fi
          echo "=== manifest camera lines ==="
          grep -n "CAMERA\|hardware.camera" "$MANIFEST" || echo "WARNING: camera entries not injected"
      - name: Add microphone permission (voice input)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" */>#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />#' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n</manifest>#' "$MANIFEST"
          fi
          if ! grep -q 'android.hardware.microphone' "$MANIFEST"; then
            sed -i 's#<uses-permission android:name="android.permission.RECORD_AUDIO" */>#&\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' "$MANIFEST"
          fi
          if ! grep -q 'android.speech.RecognitionService' "$MANIFEST"; then
            sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n</manifest>#' "$MANIFEST"
          fi
          echo "=== manifest microphone lines ==="
          grep -n "RECORD_AUDIO\|hardware.microphone\|RecognitionService" "$MANIFEST" || echo "ERROR: microphone entries NOT injected"
      - name: Grant WebView microphone access (MainActivity)
        run: |
          ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -1)
          if [ -z "$ACT" ]; then echo "ERROR: MainActivity.java not found"; exit 1; fi
          echo "Patching: $ACT"
          PKG=$(grep -m1 '^package ' "$ACT" | sed 's/package //;s/;//')
          printf '%s\n' \
            "package $PKG;" \
            "" \
            "import android.Manifest;" \
            "import android.content.pm.PackageManager;" \
            "import android.os.Bundle;" \
            "import android.webkit.PermissionRequest;" \
            "import android.webkit.WebChromeClient;" \
            "import androidx.core.app.ActivityCompat;" \
            "import androidx.core.content.ContextCompat;" \
            "import com.getcapacitor.BridgeActivity;" \
            "" \
            "public class MainActivity extends BridgeActivity {" \
            "  private static final int MIC_REQ = 7331;" \
            "" \
            "  @Override" \
            "  public void onCreate(Bundle savedInstanceState) {" \
            "    super.onCreate(savedInstanceState);" \
            "    if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)" \
            "        != PackageManager.PERMISSION_GRANTED) {" \
            "      ActivityCompat.requestPermissions(this," \
            "          new String[]{Manifest.permission.RECORD_AUDIO}, MIC_REQ);" \
            "    }" \
            "    this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {" \
            "      @Override" \
            "      public void onPermissionRequest(final PermissionRequest request) {" \
            "        runOnUiThread(new Runnable() {" \
            "          @Override" \
            "          public void run() {" \
            "            for (String r : request.getResources()) {" \
            "              if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) {" \
            "                request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});" \
            "                return;" \
            "              }" \
            "            }" \
            "            request.deny();" \
            "          }" \
            "        });" \
            "      }" \
            "    });" \
            "  }" \
            "}" \
            > "$ACT"
          echo "=== MainActivity.java ==="
          cat "$ACT"
      - name: Suppress compileSdk 36 warning
        run: |
          GP=android/gradle.properties
          touch "$GP"
          if ! grep -q "suppressUnsupportedCompileSdk" "$GP"; then
            echo "android.suppressUnsupportedCompileSdk=36" >> "$GP"
          fi
          tail -3 "$GP"

      - name: Force Google Play Billing 8.0.0+
        run: |
          # Плагин @squareetlabs/capacitor-subscriptions тянет billing:7.1.1,
          # а Google Play c 31.08.2026 требует 8.0.0+. Поднимаем принудительно.
          GRADLE=android/app/build.gradle
          if grep -q "billingclient:billing:8" "$GRADLE"; then
            echo "Billing 8 already forced, skipping."
          else
            printf '%s\n' \
              "" \
              "// Google Play requires Billing Library 8.0.0+ from 2026-08-31" \
              "configurations.configureEach {" \
              "    resolutionStrategy {" \
              "        force 'com.android.billingclient:billing:8.0.0'" \
              "        eachDependency { details ->" \
              "            if (details.requested.group == 'com.android.billingclient') {" \
              "                details.useVersion '8.0.0'" \
              "            }" \
              "        }" \
              "    }" \
              "}" \
              >> "$GRADLE"
            echo "=== Billing 8.0.0 forced ==="
          fi
          tail -16 "$GRADLE"

      - name: Verify Billing version in dependency tree
        run: |
          cd android
          chmod +x ./gradlew
          echo "=== billingclient in dependency tree ==="
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath 2>/dev/null | grep -i "billingclient" | sort -u || echo "billingclient not found"
          echo "(если видно 7.x -> 8.0.0, принуждение сработало)"

      - name: Add notification permissions and deep link
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'POST_NOTIFICATIONS' "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MANIFEST"
          fi
          # ТОЧНЫЕ БУДИЛЬНИКИ НЕ ИСПОЛЬЗУЕМ СОЗНАТЕЛЬНО:
          # USE_EXACT_ALARM — ограниченное разрешение Google Play (только будильники/календари),
          # SCHEDULE_EXACT_ALARM требует обоснования при проверке.
          # Плагин local-notifications сам откатывается на setAndAllowWhileIdle —
          # напоминание может сместиться на несколько минут, для «запиши обед» это неважно.
          # Если разрешения остались от прошлых сборок — удаляем.
          sed -i '/SCHEDULE_EXACT_ALARM/d;/USE_EXACT_ALARM/d' "$MANIFEST"
          printf '%s\n' \
            "import sys" \
            "p=sys.argv[1]" \
            "s=open(p,encoding='utf-8').read()" \
            "if 'android:scheme=\"kalon\"' not in s:" \
            "    intent='<intent-filter><action android:name=\"android.intent.action.VIEW\"/><category android:name=\"android.intent.category.DEFAULT\"/><category android:name=\"android.intent.category.BROWSABLE\"/><data android:scheme=\"kalon\"/></intent-filter>'" \
            "    i=s.find('</activity>')" \
            "    if i>0:" \
            "        s=s[:i]+intent+s[i:]" \
            "        open(p,'w',encoding='utf-8').write(s)" \
            "        print('deep link injected')" \
            > /tmp/deeplink.py
          python3 /tmp/deeplink.py "$MANIFEST"
          echo "=== notification / deeplink ==="
          grep -c "POST_NOTIFICATIONS" "$MANIFEST" || echo "WARN: no POST_NOTIFICATIONS"
          grep -c 'scheme="kalon"' "$MANIFEST" || echo "WARN: no deep link"

      - name: Create home screen widget
        run: |
          ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -1)
          PKG=$(grep -m1 '^package ' "$ACT" | sed 's/package //;s/;//')
          PKGDIR="android/app/src/main/java/$(echo $PKG | tr '.' '/')"
          echo "Package: $PKG"
          mkdir -p "$PKGDIR" android/app/src/main/res/layout android/app/src/main/res/xml android/app/src/main/res/drawable

          printf '%s\n' \
            "package $PKG;" \
            "" \
            "import android.app.PendingIntent;" \
            "import android.appwidget.AppWidgetManager;" \
            "import android.appwidget.AppWidgetProvider;" \
            "import android.content.ComponentName;" \
            "import android.content.Context;" \
            "import android.content.Intent;" \
            "import android.content.SharedPreferences;" \
            "import android.net.Uri;" \
            "import android.widget.RemoteViews;" \
            "import org.json.JSONObject;" \
            "" \
            "public class KalonWidget extends AppWidgetProvider {" \
            "  @Override" \
            "  public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {" \
            "    for (int id : ids) render(ctx, mgr, id);" \
            "  }" \
            "  public static void refreshAll(Context ctx) {" \
            "    try {" \
            "      AppWidgetManager mgr = AppWidgetManager.getInstance(ctx);" \
            "      int[] ids = mgr.getAppWidgetIds(new ComponentName(ctx, KalonWidget.class));" \
            "      for (int id : ids) render(ctx, mgr, id);" \
            "    } catch (Throwable t) {}" \
            "  }" \
            "  static void render(Context ctx, AppWidgetManager mgr, int id) {" \
            "    RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.kalon_widget);" \
            "    int eaten = 0, goal = 2000, water = 0, streak = 0;" \
            "    try {" \
            "      SharedPreferences p = ctx.getSharedPreferences(\"CapacitorStorage\", Context.MODE_PRIVATE);" \
            "      String raw = p.getString(\"kalon_widget\", null);" \
            "      if (raw != null) {" \
            "        JSONObject j = new JSONObject(raw);" \
            "        eaten = j.optInt(\"eaten\", 0);" \
            "        goal = j.optInt(\"goal\", 2000);" \
            "        water = j.optInt(\"water\", 0);" \
            "        streak = j.optInt(\"streak\", 0);" \
            "      }" \
            "    } catch (Throwable t) {}" \
            "    int left = goal > eaten ? goal - eaten : 0;" \
            "    v.setTextViewText(R.id.w_eaten, String.valueOf(eaten));" \
            "    v.setTextViewText(R.id.w_goal, \"/ \" + goal);" \
            "    v.setTextViewText(R.id.w_left, String.valueOf(left));" \
            "    v.setTextViewText(R.id.w_water, water + \"/8\");" \
            "    v.setTextViewText(R.id.w_streak, streak >= 2 ? String.valueOf(streak) : \"\");" \
            "    int pct = goal > 0 ? eaten * 100 / goal : 0;" \
            "    v.setProgressBar(R.id.w_bar, 100, pct > 100 ? 100 : pct, false);" \
            "    v.setOnClickPendingIntent(R.id.w_root, deep(ctx, \"kalon://open\", 1));" \
            "    v.setOnClickPendingIntent(R.id.w_add, deep(ctx, \"kalon://add\", 2));" \
            "    v.setOnClickPendingIntent(R.id.w_mic, deep(ctx, \"kalon://voice\", 3));" \
            "    mgr.updateAppWidget(id, v);" \
            "  }" \
            "  static PendingIntent deep(Context ctx, String url, int rc) {" \
            "    Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));" \
            "    i.setPackage(ctx.getPackageName());" \
            "    i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);" \
            "    return PendingIntent.getActivity(ctx, rc, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);" \
            "  }" \
            "}" \
            > "$PKGDIR/KalonWidget.java"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">' \
            '    <solid android:color="#0E1019" />' \
            '    <corners android:radius="22dp" />' \
            '</shape>' \
            > android/app/src/main/res/drawable/kalon_widget_bg.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">' \
            '    <solid android:color="#6D5EFC" />' \
            '    <corners android:radius="14dp" />' \
            '</shape>' \
            > android/app/src/main/res/drawable/kalon_widget_btn.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:id="@+id/w_root"' \
            '    android:layout_width="match_parent"' \
            '    android:layout_height="match_parent"' \
            '    android:orientation="vertical"' \
            '    android:background="@drawable/kalon_widget_bg"' \
            '    android:padding="14dp">' \
            '    <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"' \
            '        android:orientation="horizontal" android:gravity="center_vertical">' \
            '        <TextView android:id="@+id/w_eaten" android:layout_width="wrap_content"' \
            '            android:layout_height="wrap_content" android:text="0"' \
            '            android:textColor="#F4F6FC" android:textSize="30sp" android:textStyle="bold" />' \
            '        <TextView android:id="@+id/w_goal" android:layout_width="0dp" android:layout_weight="1"' \
            '            android:layout_height="wrap_content" android:text="/ 2000"' \
            '            android:textColor="#8A94AD" android:textSize="14sp"' \
            '            android:layout_marginStart="6dp" android:paddingTop="8dp" />' \
            '        <TextView android:id="@+id/w_streak" android:layout_width="wrap_content"' \
            '            android:layout_height="wrap_content" android:text=""' \
            '            android:textColor="#FFB24D" android:textSize="15sp" android:textStyle="bold"' \
            '            android:drawableStart="@android:drawable/btn_star_big_on" android:drawablePadding="4dp" />' \
            '    </LinearLayout>' \
            '    <ProgressBar android:id="@+id/w_bar" style="?android:attr/progressBarStyleHorizontal"' \
            '        android:layout_width="match_parent" android:layout_height="8dp"' \
            '        android:layout_marginTop="8dp" android:max="100" android:progress="0" />' \
            '    <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"' \
            '        android:orientation="horizontal" android:gravity="center_vertical"' \
            '        android:layout_marginTop="10dp">' \
            '        <TextView android:id="@+id/w_left" android:layout_width="0dp" android:layout_weight="1"' \
            '            android:layout_height="wrap_content" android:text="0"' \
            '            android:textColor="#38E1FF" android:textSize="13sp" />' \
            '        <TextView android:id="@+id/w_water" android:layout_width="wrap_content"' \
            '            android:layout_height="wrap_content" android:text="0/8"' \
            '            android:textColor="#8A94AD" android:textSize="13sp" />' \
            '    </LinearLayout>' \
            '    <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"' \
            '        android:orientation="horizontal" android:layout_marginTop="12dp">' \
            '        <TextView android:id="@+id/w_add" android:layout_width="0dp" android:layout_weight="1"' \
            '            android:layout_height="42dp" android:gravity="center" android:text="+"' \
            '            android:textColor="#FFFFFF" android:textSize="20sp" android:textStyle="bold"' \
            '            android:background="@drawable/kalon_widget_btn" />' \
            '        <TextView android:id="@+id/w_mic" android:layout_width="52dp"' \
            '            android:layout_height="42dp" android:gravity="center" android:text="MIC"' \
            '            android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"' \
            '            android:layout_marginStart="8dp"' \
            '            android:background="@drawable/kalon_widget_btn" />' \
            '    </LinearLayout>' \
            '</LinearLayout>' \
            > android/app/src/main/res/layout/kalon_widget.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:minWidth="250dp"' \
            '    android:minHeight="110dp"' \
            '    android:updatePeriodMillis="1800000"' \
            '    android:initialLayout="@layout/kalon_widget"' \
            '    android:resizeMode="horizontal|vertical"' \
            '    android:widgetCategory="home_screen" />' \
            > android/app/src/main/res/xml/kalon_widget_info.xml

          printf '%s\n' \
            "import sys" \
            "p=sys.argv[1]" \
            "s=open(p,encoding='utf-8').read()" \
            "if 'KalonWidget' not in s:" \
            "    rec='<receiver android:name=\".KalonWidget\" android:exported=\"false\"><intent-filter><action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\"/></intent-filter><meta-data android:name=\"android.appwidget.provider\" android:resource=\"@xml/kalon_widget_info\"/></receiver>'" \
            "    i=s.rfind('</application>')" \
            "    if i>0:" \
            "        s=s[:i]+rec+s[i:]" \
            "        open(p,'w',encoding='utf-8').write(s)" \
            "        print('widget receiver injected')" \
            > /tmp/widget.py
          python3 /tmp/widget.py android/app/src/main/AndroidManifest.xml

          echo "=== widget files ==="
          ls -la "$PKGDIR/KalonWidget.java" android/app/src/main/res/layout/kalon_widget.xml
          grep -c "KalonWidget" android/app/src/main/AndroidManifest.xml || echo "WARN: receiver missing"

      - name: Refresh widget on app pause
        run: |
          ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -1)
          if grep -q "KalonWidget" "$ACT"; then
            echo "already patched"
          else
            printf '%s\n' \
              "import sys" \
              "p=sys.argv[1]" \
              "s=open(p,encoding='utf-8').read()" \
              "add='\\n  @Override\\n  public void onPause() {\\n    super.onPause();\\n    try { KalonWidget.refreshAll(this); } catch (Throwable t) {}\\n  }\\n'" \
              "i=s.rfind('}')" \
              "s=s[:i]+add+s[i:]" \
              "open(p,'w',encoding='utf-8').write(s)" \
              "print('onPause added')" \
              > /tmp/pause.py
            python3 /tmp/pause.py "$ACT"
          fi
          cat "$ACT"

      - name: Harden network security (no cleartext HTTP)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's#<application #<application android:usesCleartextTraffic="false" #' "$MANIFEST"
          fi
          grep -n "usesCleartextTraffic" "$MANIFEST" || echo "note: cleartext attr not present"
      - name: Enable Android Auto Backup
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="false"/android:allowBackup="true"/' "$MANIFEST"
          grep -n "allowBackup" "$MANIFEST" || echo "allowBackup attr not present (default true)"
      - name: Show final manifest
        run: |
          echo "=== FINAL AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml
      - name: Device compatibility report
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          echo "═══ ЧТО ВЛИЯЕТ НА СПИСОК УСТРОЙСТВ ═══"
          echo "--- minSdk / targetSdk ---"
          grep -E "minSdkVersion|targetSdkVersion" android/variables.gradle || true
          echo "--- uses-feature (required=true отсекает устройства!) ---"
          grep -o '<uses-feature[^>]*>' "$MANIFEST" || echo "нет uses-feature"
          echo "--- ВНИМАНИЕ: обязательные фичи ---"
          if grep -o '<uses-feature[^>]*>' "$MANIFEST" | grep -v 'required="false"'; then
            echo ">>> ЭТИ ФИЧИ ОБЯЗАТЕЛЬНЫ И СУЖАЮТ СПИСОК УСТРОЙСТВ <<<"
          else
            echo "все uses-feature помечены required=false — ок"
          fi
          echo "--- разрешения, которые Play трактует как требование железа ---"
          grep -oE 'android.permission.(CAMERA|RECORD_AUDIO|NFC|BLUETOOTH[A-Z_]*)' "$MANIFEST" | sort -u || echo "нет"

      - name: Prepare icon
        run: |
          mkdir -p resources
          if [ -f ../resources/icon.png ]; then
            cp ../resources/icon.png resources/icon.png
          elif [ -f ../icon.png ]; then
            cp ../icon.png resources/icon.png
          elif [ -f resources/icon.png ]; then
            echo "using existing kalon-project/resources/icon.png"
          else
            echo "ERROR: icon.png not found (checked ../resources/, ../, resources/)"; exit 1
          fi
          ls -la resources/icon.png
      - name: Generate app icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0c0e17' --iconBackgroundColorDark '#0c0e17'
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/kalon-keystore.jks
          ls -la android/kalon-keystore.jks
      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            "-Pandroid.injected.signing.store.file=$(pwd)/kalon-keystore.jks" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: kalon-release-aab
          path: kalon-project/android/app/build/outputs/bundle/release/app-release.aab
