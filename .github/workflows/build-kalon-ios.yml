name: Build Kalon iOS

# ВАЖНО: iOS собирается ТОЛЬКО на macOS-раннере (нужен Xcode).
# Такие раннеры платные на приватных репозиториях — на публичных бесплатны.
on:
  push:
    branches: [ main ]
    paths:
      - 'kalon-project/www/**'
      - '.github/workflows/build-kalon-ios.yml'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: kalon-project

env:
  # Apple: CFBundleShortVersionString — максимум ТРИ числа через точку.
  # "1.7.0.0" отклоняется, у Android такого ограничения нет.
  APP_VERSION_NAME: "1.7.0"
  BUILD_NUMBER_OFFSET: "100"
  # Bundle ID должен совпадать с тем, что заведён в App Store Connect
  BUNDLE_ID: "ai.synaxsword.kalon"
  # AdMob для iOS. У каждой платформы СВОЙ идентификатор приложения —
  # android-овский здесь не работает. Пока стоит официальный ТЕСТОВЫЙ ID Google:
  # приложение запускается и показывает тестовую рекламу, дохода нет.
  # Заведи приложение iOS в консоли AdMob и подставь сюда свой ca-app-pub-XXXX~YYYY.
  ADMOB_IOS_APP_ID: "ca-app-pub-1788139495634661~5356552816"
  # Минимальная версия iOS. Capacitor 6 требует 13.0+.
  # iOS 15.0 — StoreKit 2 в плагине подписок помечен @available(iOS 15).
  # С 14.0 компиляция падает на несовпадении версий. iOS 14 в 2026 — доли процента.
  IOS_DEPLOYMENT_TARGET: "15.0"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select Xcode
        run: |
          echo "═══ УСТАНОВЛЕННЫЕ ВЕРСИИ XCODE ═══"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(ничего не найдено)"
          # Берём самый новый: Apple требует сборку на актуальном SDK,
          # старые Xcode дают отказ "SDK version issue" при загрузке.
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$NEWEST" ]; then echo "::error::Xcode не найден"; exit 1; fi
          echo "Выбран: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          echo ""
          echo "═══ ДОСТУПНЫЕ iOS SDK ═══"
          xcodebuild -showsdks | grep -i "iphoneos" || true
          SDKVER=$(xcodebuild -showsdks | grep -oE 'iphoneos[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "максимальный iOS SDK: $SDKVER"
          if [ -n "$SDKVER" ] && [ "$SDKVER" -lt 26 ] 2>/dev/null; then
            echo "::warning::iOS SDK $SDKVER — Apple требует 26+. Загрузка в App Store Connect будет отклонена."
          fi

      - name: Install dependencies
        run: npm install

      - name: Install iOS plugins
        run: |
          # Версии плагинов должны совпадать с мажорной версией @capacitor/core
          CAPVER=$(node -p "require('./node_modules/@capacitor/core/package.json').version" 2>/dev/null || echo "6.0.0")
          MAJ=$(echo "$CAPVER" | cut -d. -f1)
          if [ -z "$MAJ" ] || [ "$MAJ" -lt 5 ] 2>/dev/null; then MAJ=6; fi
          echo "Capacitor core: $CAPVER -> плагины ^${MAJ}.0.0"
          npm install "@capacitor/ios@^${MAJ}.0.0" --save
          # Web Speech API НЕ работает в WKWebView (Apple не включила его).
          # Нативное распознавание через SFSpeechRecognizer:
          npm install "@capacitor-community/speech-recognition@^${MAJ}.0.0" --save
          npm install "@capacitor/local-notifications@^${MAJ}.0.0" --save || true
          npm install "@capacitor/preferences@^${MAJ}.0.0" --save || true
          # ── плагин подписок: закрепляем 1.0.21 ТОЛЬКО для iOS ──
          # В 1.0.25 в Subscriptions.swift:280 обращение к UIApplication.shared
          # идёт без await из async-контекста — Xcode 15+ это не компилирует
          # (error: expression is 'async' but is not marked with 'await').
          # В 1.0.21 тот же код написан корректно, а все нужные приложению методы
          # (purchaseProduct, getCurrentEntitlements, addListener) на месте.
          # Android продолжает собираться со своей версией — здесь ephemeral-раннер.
          if [ -d node_modules/@squareetlabs/capacitor-subscriptions ]; then
            npm install "@squareetlabs/capacitor-subscriptions@1.0.21" --save
            echo "подписки закреплены: $(node -p "require('./node_modules/@squareetlabs/capacitor-subscriptions/package.json').version")"
          fi
          echo "=== версии ==="
          node -p "JSON.stringify({core:require('./node_modules/@capacitor/core/package.json').version,ios:require('./node_modules/@capacitor/ios/package.json').version,speech:require('./node_modules/@capacitor-community/speech-recognition/package.json').version},null,1)"

      - name: Add iOS platform
        run: npx cap add ios || echo "ios platform already exists"

      - name: Set version and build number
        run: |
          BN=$(( ${{ github.run_number }} + ${{ env.BUILD_NUMBER_OFFSET }} ))
          echo "Version ${{ env.APP_VERSION_NAME }} build $BN"
          cd ios/App
          # CFBundleShortVersionString — то, что видит пользователь
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ env.APP_VERSION_NAME }}" App/Info.plist
          # CFBundleVersion — уникальный номер сборки, должен расти
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" App/Info.plist

      - name: Add privacy usage descriptions (Info.plist)
        run: |
          # БЕЗ ЭТИХ СТРОК ПРИЛОЖЕНИЕ ПАДАЕТ ПРИ ЗАПРОСЕ РАЗРЕШЕНИЯ
          # и Apple отклоняет сборку на ревью.
          PLIST=ios/App/App/Info.plist
          add() {
            /usr/libexec/PlistBuddy -c "Delete :$1" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"
          }
          add NSMicrophoneUsageDescription "Микрофон нужен, чтобы записывать приёмы пищи голосом."
          add NSSpeechRecognitionUsageDescription "Распознавание речи превращает сказанное в запись о еде."
          add NSCameraUsageDescription "Камера нужна для сканирования штрих-кодов на упаковке."
          add NSPhotoLibraryUsageDescription "Доступ к фото нужен, чтобы добавлять снимки блюд."
          # Реклама: Apple требует запрос на отслеживание (ATT)
          add NSUserTrackingUsageDescription "Разрешение позволяет показывать более подходящую рекламу."
          # Экспортное шифрование: своего шифрования нет, только системный HTTPS.
          # Без этого ключа App Store Connect спрашивает про шифрование
          # у КАЖДОЙ загруженной сборки и блокирует её до ответа.
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          echo "=== privacy keys ==="
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -A0 "UsageDescription" || true

      - name: Inject AdMob App ID (Info.plist)
        run: |
          # БЕЗ ЭТОГО КЛЮЧА ПРИЛОЖЕНИЕ ПАДАЕТ ПРЯМО НА ЗАПУСКЕ.
          # Google Mobile Ads SDK проверяет GADApplicationIdentifier при старте
          # и аварийно завершает процесс, если ключа нет. Это штатное поведение SDK.
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :GADApplicationIdentifier" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string ${{ env.ADMOB_IOS_APP_ID }}" "$PLIST"
          echo "GADApplicationIdentifier = $(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$PLIST")"
          case "${{ env.ADMOB_IOS_APP_ID }}" in
            ca-app-pub-3940256099942544*)
              echo "::warning::Используется ТЕСТОВЫЙ идентификатор AdMob — реклама тестовая, дохода нет. Замени ADMOB_IOS_APP_ID на свой." ;;
          esac

      - name: Configure App Transport Security and orientation
        run: |
          PLIST=ios/App/App/Info.plist
          # только портрет — приложение под него свёрстано
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          # запрещаем незашифрованный HTTP (как и на Android)
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool false" "$PLIST"

      - name: Set deployment target and bundle id
        run: |
          cd ios/App
          # минимальная версия iOS
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = ${{ env.IOS_DEPLOYMENT_TARGET }}/g" App.xcodeproj/project.pbxproj
          # bundle id
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }}/g" App.xcodeproj/project.pbxproj
          echo "=== проверка ==="
          grep -m3 "IPHONEOS_DEPLOYMENT_TARGET\|PRODUCT_BUNDLE_IDENTIFIER" App.xcodeproj/project.pbxproj

      - name: Prepare icon
        run: |
          mkdir -p resources
          # ОТДЕЛЬНАЯ ИКОНКА ДЛЯ iOS.
          # Если положить icon-ios.png — она пойдёт только в iOS-сборку,
          # а Android продолжит собираться со своей icon.png.
          # Если файла нет — берётся общая иконка, как раньше.
          if   [ -f resources/icon-ios.png ]; then cp resources/icon-ios.png resources/icon.png; echo "iOS-иконка: resources/icon-ios.png"
          elif [ -f ../resources/icon-ios.png ]; then cp ../resources/icon-ios.png resources/icon.png; echo "iOS-иконка: ../resources/icon-ios.png"
          elif [ -f ../icon-ios.png ]; then cp ../icon-ios.png resources/icon.png; echo "iOS-иконка: ../icon-ios.png"
          elif [ -f ../resources/icon.png ]; then cp ../resources/icon.png resources/icon.png; echo "общая иконка: ../resources/icon.png"
          elif [ -f ../icon.png ]; then cp ../icon.png resources/icon.png; echo "общая иконка: ../icon.png"
          elif [ -f resources/icon.png ]; then echo "общая иконка: resources/icon.png (уже на месте)"
          else echo "ERROR: иконка не найдена (искал icon-ios.png и icon.png)"; exit 1; fi
          ls -la resources/icon.png
          # печатаем размер — Apple требует квадрат не меньше 1024×1024
          python3 -c "from PIL import Image; im=Image.open('resources/icon.png'); print('размер иконки:', im.size)" 2>/dev/null || \
            sips -g pixelWidth -g pixelHeight resources/icon.png

      - name: Generate app icons
        run: npx @capacitor/assets generate --ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Pin ad consent SDK (Podfile)
        run: |
          # GoogleUserMessagingPlatform 3.0 (24.03.2025) переименовал ВСЕ классы:
          # UMPConsentInformation -> ConsentInformation, sharedInstance -> shared и т.д.
          # Плагин admob написан под версию 2 и с новой не компилируется.
          # В его podspec закреплён только Google-Mobile-Ads-SDK, а UMP тянется
          # транзитивно без ограничения — CocoaPods берёт свежую. Закрепляем сами.
          printf '%s\n' \
            "import sys, re" \
            "p = sys.argv[1]" \
            "s = open(p, encoding='utf-8').read()" \
            "changed = []" \
            "new_platform = \"platform :ios, '\" + sys.argv[2] + \"'\"" \
            "if re.search(r\"platform :ios, '[0-9.]+'\", s):" \
            "    s = re.sub(r\"platform :ios, '[0-9.]+'\", new_platform, s)" \
            "    changed.append('platform')" \
            "pin = \"  pod 'GoogleUserMessagingPlatform', '< 3.0'\\n\"" \
            "if 'GoogleUserMessagingPlatform' not in s:" \
            "    if '# Add your Pods here' in s:" \
            "        s = s.replace('# Add your Pods here', pin.strip() + '\\n  # Add your Pods here', 1)" \
            "        changed.append('pin')" \
            "    else:" \
            "        m = re.search(r\"(target 'App' do\\n)\", s)" \
            "        if m:" \
            "            s = s[:m.end()] + pin + s[m.end():]" \
            "            changed.append('pin')" \
            "open(p, 'w', encoding='utf-8').write(s)" \
            "print('изменено:', ', '.join(changed) if changed else 'ничего')" \
            > /tmp/podfile_patch.py
          python3 /tmp/podfile_patch.py ios/App/Podfile "${{ env.IOS_DEPLOYMENT_TARGET }}"
          # ВАЖНО: `npx cap add ios` уже прогнал pod install и записал в Podfile.lock
          # версию UMP 3.1.0. Замок конфликтует с новым требованием ~> 2.7,
          # поэтому сносим его и папку Pods — зависимости пересчитаются с нуля.
          rm -f ios/App/Podfile.lock
          rm -rf ios/App/Pods
          echo "Podfile.lock и Pods удалены — пересчёт зависимостей будет чистым"
          echo "=== Podfile ==="
          cat ios/App/Podfile

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update
          ls -la App.xcworkspace

      # ══════════════════════════════════════════════════════════
      # ПОДПИСЬ. Требует секретов репозитория:
      #   IOS_CERTIFICATE_BASE64  — сертификат .p12 в base64
      #   IOS_CERTIFICATE_PASSWORD — пароль от .p12
      #   IOS_PROVISION_PROFILE_BASE64 — профиль .mobileprovision в base64
      #   KEYCHAIN_PASSWORD — любой придуманный пароль для временной связки
      # ══════════════════════════════════════════════════════════
      - name: Import signing certificate
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PWD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KC_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "::warning::Секреты подписи не заданы — только проверка компиляции"
            echo "SIGNED=false" >> $GITHUB_ENV
            exit 0
          fi
          CERT=$RUNNER_TEMP/cert.p12
          PROFILE=$RUNNER_TEMP/profile.mobileprovision
          KC=$RUNNER_TEMP/build.keychain-db
          echo -n "$CERT_B64" | base64 --decode -o $CERT
          echo -n "$PROFILE_B64" | base64 --decode -o $PROFILE

          # временная связка ключей
          security create-keychain -p "$KC_PWD" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KC_PWD" $KC
          # -T разрешает codesign пользоваться ключом без запроса пароля
          security import $CERT -P "$CERT_PWD" -A -t cert -f pkcs12 -k $KC \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PWD" $KC >/dev/null
          security list-keychain -d user -s $KC

          # ── разбираем профиль: без этих данных ручная подпись невозможна ──
          security cms -D -i $PROFILE > $RUNNER_TEMP/profile.plist
          PROF_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $RUNNER_TEMP/profile.plist)
          PROF_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $RUNNER_TEMP/profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" $RUNNER_TEMP/profile.plist)
          PROF_APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" $RUNNER_TEMP/profile.plist)
          echo "Профиль: $PROF_NAME"
          echo "UUID:    $PROF_UUID"
          echo "Team:    $TEAM_ID"
          echo "App ID:  $PROF_APPID"

          # Xcode ищет профили по UUID в этой папке
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE ~/Library/MobileDevice/Provisioning\ Profiles/$PROF_UUID.mobileprovision

          # имя сертификата для CODE_SIGN_IDENTITY
          IDENTITY=$(security find-identity -v -p codesigning $KC | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "Сертификат: $IDENTITY"
          if [ -z "$IDENTITY" ]; then
            echo "::error::Сертификат не импортировался — проверь IOS_CERTIFICATE_PASSWORD"
            exit 1
          fi

          echo "SIGNED=true" >> $GITHUB_ENV
          echo "PROF_UUID=$PROF_UUID" >> $GITHUB_ENV
          echo "PROF_NAME=$PROF_NAME" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "SIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV

          # сверяем bundle id профиля с тем, что собираем
          case "$PROF_APPID" in
            *"${{ env.BUNDLE_ID }}") echo "Bundle ID совпадает с профилем ✓" ;;
            *) echo "::warning::Bundle ID профиля ($PROF_APPID) не совпадает с ${{ env.BUNDLE_ID }}" ;;
          esac

      - name: Configure signing for App target only
        if: env.SIGNED == 'true'
        env:
          IOS_MIN: ${{ env.IOS_DEPLOYMENT_TARGET }}
        run: |
          # Настройки подписи нельзя передавать в командной строке xcodebuild —
          # они применятся ко ВСЕМ целям, включая библиотеки плагинов,
          # а те профили не поддерживают и валят сборку.
          # Прописываем подпись в проект точечно: приложению — да, библиотекам — нет.
          # ВАЖНО: у библиотек настройку не УДАЛЯЕМ, а обнуляем пустой строкой —
          # удаление позволяет ей унаследоваться с уровня проекта.
          printf '%s\n' \
            "require 'xcodeproj'" \
            "" \
            "def strip_signing(configs)" \
            "  configs.each do |c|" \
            "    c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''" \
            "    c.build_settings['PROVISIONING_PROFILE'] = ''" \
            "    c.build_settings['CODE_SIGN_IDENTITY'] = ''" \
            "    c.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = ''" \
            "    c.build_settings['CODE_SIGN_STYLE'] = 'Automatic'" \
            "    c.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'" \
            "    c.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'" \
            "    c.build_settings['DEVELOPMENT_TEAM'] = ''" \
            "    # CocoaPods берёт минимальную версию из podspec каждого плагина" \
            "    # (у подписок там 12.0). Из-за этого @available(iOS 15) не сходится" \
            "    # и StoreKit 2 не компилируется. Поднимаем всем принудительно." \
            "    c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = ENV['IOS_MIN'] || '15.0'" \
            "  end" \
            "end" \
            "" \
            "# ── библиотеки: подпись снимаем полностью ──" \
            "pods_path = File.join('Pods','Pods.xcodeproj')" \
            "if File.exist?(pods_path)" \
            "  pods = Xcodeproj::Project.open(pods_path)" \
            "  strip_signing(pods.build_configurations)" \
            "  pods.targets.each { |t| strip_signing(t.build_configurations) }" \
            "  pods.save" \
            "  puts 'библиотек обработано: ' + pods.targets.size.to_s" \
            "else" \
            "  puts 'Pods.xcodeproj не найден'" \
            "end" \
            "" \
            "# ── приложение: ставим ручную подпись ──" \
            "proj = Xcodeproj::Project.open('App.xcodeproj')" \
            "strip_signing(proj.build_configurations)" \
            "app = proj.targets.find { |t| t.name == 'App' }" \
            "abort('ОШИБКА: цель App не найдена') if app.nil?" \
            "app.build_configurations.each do |c|" \
            "  c.build_settings['CODE_SIGN_STYLE'] = 'Manual'" \
            "  c.build_settings['CODE_SIGNING_ALLOWED'] = 'YES'" \
            "  c.build_settings['CODE_SIGNING_REQUIRED'] = 'YES'" \
            "  c.build_settings['DEVELOPMENT_TEAM'] = ENV['TEAM_ID']" \
            "  c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROF_NAME']" \
            "  c.build_settings['CODE_SIGN_IDENTITY'] = ENV['SIGN_IDENTITY']" \
            "  c.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = ENV['SIGN_IDENTITY']" \
            "end" \
            "proj.save" \
            "puts 'App: ручная подпись установлена'" \
            > /tmp/sign.rb
          cd ios/App
          ruby /tmp/sign.rb

          echo ""
          echo "═══ ПРОВЕРКА: у библиотек не должно остаться профиля ═══"
          if grep -q 'PROVISIONING_PROFILE_SPECIFIER = "Kalon' Pods/Pods.xcodeproj/project.pbxproj 2>/dev/null; then
            echo "::error::у библиотек всё ещё прописан профиль — сборка упадёт"
            grep -n 'PROVISIONING_PROFILE_SPECIFIER' Pods/Pods.xcodeproj/project.pbxproj | head -5
            exit 1
          fi
          echo "чисто"
          echo ""
          echo "═══ минимальная версия iOS у библиотек ═══"
          grep -o 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*' Pods/Pods.xcodeproj/project.pbxproj | sort -u
          echo ""
          echo "═══ настройки приложения ═══"
          grep -E 'PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE' App.xcodeproj/project.pbxproj | sort -u | head -8

      - name: Build archive
        run: |
          cd ios/App
          LOG="$RUNNER_TEMP/xcodebuild.log"
          # пишем в файл БЕЗ конвейера: так код возврата берётся напрямую,
          # без PIPESTATUS, который в прошлый раз повёл себя непредсказуемо
          set +e
          if [ "$SIGNED" = "true" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App \
              -configuration Release -sdk iphoneos \
              -archivePath "$RUNNER_TEMP/Kalon.xcarchive" \
              -destination 'generic/platform=iOS' \
              archive > "$LOG" 2>&1
          else
            xcodebuild -workspace App.xcworkspace -scheme App \
              -configuration Release -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
              build > "$LOG" 2>&1
          fi
          RC=$?
          set -e

          echo "код возврата xcodebuild: $RC"
          echo ""
          echo "═════════ ОШИБКИ КОМПИЛЯЦИИ ═════════"
          grep -E "(error|fatal error|warning: .*will never be executed):" "$LOG" \
            | grep -v "^warning:" | sort -u | head -40 || echo "(строк с error: не найдено)"
          echo ""
          echo "═════════ ЧТО НЕ СОБРАЛОСЬ ═════════"
          grep -A6 "The following build commands failed" "$LOG" | head -20 || true
          echo ""
          if [ "$RC" != "0" ]; then
            echo "═════════ ПОСЛЕДНИЕ 60 СТРОК ═════════"
            tail -60 "$LOG"
            echo ""
            echo "Полный лог сохранён в артефакт xcodebuild-log — скачай его со страницы сборки"
            exit $RC
          fi
          echo "Сборка прошла успешно"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Export IPA
        if: env.SIGNED == 'true'
        run: |
          PL=$RUNNER_TEMP/ExportOptions.plist
          # пишем plist целиком: teamID и имя профиля обязательны для ручной подписи
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>method</key><string>app-store</string>' \
            '  <key>signingStyle</key><string>manual</string>' \
            "  <key>teamID</key><string>$TEAM_ID</string>" \
            '  <key>uploadSymbols</key><true/>' \
            '  <key>provisioningProfiles</key>' \
            '  <dict>' \
            "    <key>${{ env.BUNDLE_ID }}</key><string>$PROF_NAME</string>" \
            '  </dict>' \
            '</dict>' \
            '</plist>' \
            > $PL
          echo "=== ExportOptions.plist ==="
          cat $PL
          plutil -lint $PL
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Kalon.xcarchive \
            -exportOptionsPlist $PL \
            -exportPath $RUNNER_TEMP/export
          ls -la $RUNNER_TEMP/export

      - name: Upload IPA
        if: env.SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kalon-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload archive (unsigned check)
        if: env.SIGNED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kalon-ios-archive
          path: ${{ runner.temp }}/Kalon.xcarchive

      # ══════════════════════════════════════════════════════════
      # ЗАГРУЗКА В APP STORE CONNECT прямо из облака.
      # Нужны секреты (создаются в App Store Connect → Users and Access → Keys):
      #   ASC_KEY_ID      — идентификатор ключа (10 символов)
      #   ASC_ISSUER_ID   — Issuer ID (длинный UUID со страницы Keys)
      #   ASC_KEY_BASE64  — сам файл .p8 в base64
      # Без них шаг пропускается — IPA просто останется артефактом.
      # ══════════════════════════════════════════════════════════
      - name: Upload to App Store Connect
        # НЕ роняем job: IPA уже собран и лежит в артефактах.
        # Если загрузка не пройдёт — файл можно отправить позже.
        continue-on-error: true
        if: env.SIGNED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "::notice::Ключи App Store Connect не заданы — IPA остаётся артефактом"
            exit 0
          fi

          echo "═══ ПРОВЕРКА КЛЮЧЕЙ ═══"
          # Key ID: ровно 10 символов
          echo "длина ASC_KEY_ID: ${#ASC_KEY_ID} (должно быть 10)"
          if [ ${#ASC_KEY_ID} -ne 10 ]; then
            echo "::error::ASC_KEY_ID должен быть ровно 10 символов"
          fi
          # Issuer ID: UUID вида 8-4-4-4-12
          echo "длина ASC_ISSUER_ID: ${#ASC_ISSUER_ID} (должно быть 36)"
          if ! echo "$ASC_ISSUER_ID" | grep -qE '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::ASC_ISSUER_ID не похож на UUID. Это длинный код с дефисами со страницы Keys, НЕ идентификатор ключа."
          fi

          mkdir -p ~/.appstoreconnect/private_keys
          KEYFILE=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o "$KEYFILE" 2>/dev/null || \
            echo -n "$ASC_KEY_BASE64" | base64 -d > "$KEYFILE"

          echo "размер ключа: $(wc -c < "$KEYFILE") байт"
          if head -1 "$KEYFILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "формат ключа: корректный PEM ✓"
          else
            echo "::error::Файл ключа повреждён. Первая строка должна быть -----BEGIN PRIVATE KEY-----"
            echo "получено: $(head -c 60 "$KEYFILE")"
          fi
          echo ""

          IPA=$(ls $RUNNER_TEMP/export/*.ipa | head -1)
          echo "Загружаем: $IPA ($(du -h "$IPA" | cut -f1))"
          set +e
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --verbose
          RC=$?
          set -e
          if [ "$RC" != "0" ]; then
            echo ""
            echo "═══════════════════════════════════════════════"
            echo "Загрузка не прошла, но IPA собран и лежит в артефакте kalon-ios-ipa."
            echo "Частые причины отказа Apple:"
            echo "  1) ASC_ISSUER_ID скопирован неверно — это UUID вверху страницы Keys,"
            echo "     а не идентификатор самого ключа"
            echo "  2) у ключа роль ниже App Manager — Developer для загрузки не годится"
            echo "  3) ключ создан в другой команде (Team ID должен быть ${{ env.TEAM_ID }})"
            echo "  4) приложение с bundle ${{ env.BUNDLE_ID }} ещё не заведено"
            echo "     в App Store Connect"
            echo "═══════════════════════════════════════════════"
          fi
          exit 0

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain-db 2>/dev/null || true
