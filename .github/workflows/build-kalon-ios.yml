name: Build Kalon iOS

# ВАЖНО: iOS собирается ТОЛЬКО на macOS-раннере (нужен Xcode).
# Такие раннеры платные на приватных репозиториях — на публичных бесплатны.
on:
  push:
    branches: [ main ]
    paths:
      - 'kalon-project/www/**'
      - '.github/workflows/build-kalon-ios.yml'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: kalon-project

env:
  APP_VERSION_NAME: "1.7.0.0"
  BUILD_NUMBER_OFFSET: "100"
  # Bundle ID должен совпадать с тем, что заведён в App Store Connect
  BUNDLE_ID: "ai.synaxsword.kalon"
  # Минимальная версия iOS. Capacitor 6 требует 13.0+.
  IOS_DEPLOYMENT_TARGET: "14.0"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          echo "=== доступные SDK ==="
          xcodebuild -showsdks | grep -i ios || true

      - name: Install dependencies
        run: npm install

      - name: Install iOS plugins
        run: |
          # Версии плагинов должны совпадать с мажорной версией @capacitor/core
          CAPVER=$(node -p "require('./node_modules/@capacitor/core/package.json').version" 2>/dev/null || echo "6.0.0")
          MAJ=$(echo "$CAPVER" | cut -d. -f1)
          if [ -z "$MAJ" ] || [ "$MAJ" -lt 5 ] 2>/dev/null; then MAJ=6; fi
          echo "Capacitor core: $CAPVER -> плагины ^${MAJ}.0.0"
          npm install "@capacitor/ios@^${MAJ}.0.0" --save
          # Web Speech API НЕ работает в WKWebView (Apple не включила его).
          # Нативное распознавание через SFSpeechRecognizer:
          npm install "@capacitor-community/speech-recognition@^${MAJ}.0.0" --save
          npm install "@capacitor/local-notifications@^${MAJ}.0.0" --save || true
          npm install "@capacitor/preferences@^${MAJ}.0.0" --save || true
          echo "=== версии ==="
          node -p "JSON.stringify({core:require('./node_modules/@capacitor/core/package.json').version,ios:require('./node_modules/@capacitor/ios/package.json').version,speech:require('./node_modules/@capacitor-community/speech-recognition/package.json').version},null,1)"

      - name: Add iOS platform
        run: npx cap add ios || echo "ios platform already exists"

      - name: Set version and build number
        run: |
          BN=$(( ${{ github.run_number }} + ${{ env.BUILD_NUMBER_OFFSET }} ))
          echo "Version ${{ env.APP_VERSION_NAME }} build $BN"
          cd ios/App
          # CFBundleShortVersionString — то, что видит пользователь
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ env.APP_VERSION_NAME }}" App/Info.plist
          # CFBundleVersion — уникальный номер сборки, должен расти
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" App/Info.plist

      - name: Add privacy usage descriptions (Info.plist)
        run: |
          # БЕЗ ЭТИХ СТРОК ПРИЛОЖЕНИЕ ПАДАЕТ ПРИ ЗАПРОСЕ РАЗРЕШЕНИЯ
          # и Apple отклоняет сборку на ревью.
          PLIST=ios/App/App/Info.plist
          add() {
            /usr/libexec/PlistBuddy -c "Delete :$1" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"
          }
          add NSMicrophoneUsageDescription "Микрофон нужен, чтобы записывать приёмы пищи голосом."
          add NSSpeechRecognitionUsageDescription "Распознавание речи превращает сказанное в запись о еде."
          add NSCameraUsageDescription "Камера нужна для сканирования штрих-кодов на упаковке."
          add NSPhotoLibraryUsageDescription "Доступ к фото нужен, чтобы добавлять снимки блюд."
          # Реклама: Apple требует запрос на отслеживание (ATT)
          add NSUserTrackingUsageDescription "Разрешение позволяет показывать более подходящую рекламу."
          echo "=== privacy keys ==="
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -A0 "UsageDescription" || true

      - name: Configure App Transport Security and orientation
        run: |
          PLIST=ios/App/App/Info.plist
          # только портрет — приложение под него свёрстано
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          # запрещаем незашифрованный HTTP (как и на Android)
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool false" "$PLIST"

      - name: Set deployment target and bundle id
        run: |
          cd ios/App
          # минимальная версия iOS
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = ${{ env.IOS_DEPLOYMENT_TARGET }}/g" App.xcodeproj/project.pbxproj
          # bundle id
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }}/g" App.xcodeproj/project.pbxproj
          echo "=== проверка ==="
          grep -m3 "IPHONEOS_DEPLOYMENT_TARGET\|PRODUCT_BUNDLE_IDENTIFIER" App.xcodeproj/project.pbxproj

      - name: Prepare icon
        run: |
          mkdir -p resources
          if [ -f ../resources/icon.png ]; then cp ../resources/icon.png resources/icon.png
          elif [ -f ../icon.png ]; then cp ../icon.png resources/icon.png
          elif [ -f resources/icon.png ]; then echo "using existing"
          else echo "ERROR: icon.png not found"; exit 1; fi
          ls -la resources/icon.png

      - name: Generate app icons
        run: npx @capacitor/assets generate --ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update
          ls -la App.xcworkspace

      # ══════════════════════════════════════════════════════════
      # ПОДПИСЬ. Требует секретов репозитория:
      #   IOS_CERTIFICATE_BASE64  — сертификат .p12 в base64
      #   IOS_CERTIFICATE_PASSWORD — пароль от .p12
      #   IOS_PROVISION_PROFILE_BASE64 — профиль .mobileprovision в base64
      #   KEYCHAIN_PASSWORD — любой придуманный пароль для временной связки
      # ══════════════════════════════════════════════════════════
      - name: Import signing certificate
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PWD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KC_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "::warning::Секреты подписи не заданы — только проверка компиляции"
            echo "SIGNED=false" >> $GITHUB_ENV
            exit 0
          fi
          CERT=$RUNNER_TEMP/cert.p12
          PROFILE=$RUNNER_TEMP/profile.mobileprovision
          KC=$RUNNER_TEMP/build.keychain-db
          echo -n "$CERT_B64" | base64 --decode -o $CERT
          echo -n "$PROFILE_B64" | base64 --decode -o $PROFILE

          # временная связка ключей
          security create-keychain -p "$KC_PWD" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KC_PWD" $KC
          # -T разрешает codesign пользоваться ключом без запроса пароля
          security import $CERT -P "$CERT_PWD" -A -t cert -f pkcs12 -k $KC \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PWD" $KC >/dev/null
          security list-keychain -d user -s $KC

          # ── разбираем профиль: без этих данных ручная подпись невозможна ──
          security cms -D -i $PROFILE > $RUNNER_TEMP/profile.plist
          PROF_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $RUNNER_TEMP/profile.plist)
          PROF_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $RUNNER_TEMP/profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" $RUNNER_TEMP/profile.plist)
          PROF_APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" $RUNNER_TEMP/profile.plist)
          echo "Профиль: $PROF_NAME"
          echo "UUID:    $PROF_UUID"
          echo "Team:    $TEAM_ID"
          echo "App ID:  $PROF_APPID"

          # Xcode ищет профили по UUID в этой папке
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE ~/Library/MobileDevice/Provisioning\ Profiles/$PROF_UUID.mobileprovision

          # имя сертификата для CODE_SIGN_IDENTITY
          IDENTITY=$(security find-identity -v -p codesigning $KC | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "Сертификат: $IDENTITY"
          if [ -z "$IDENTITY" ]; then
            echo "::error::Сертификат не импортировался — проверь IOS_CERTIFICATE_PASSWORD"
            exit 1
          fi

          echo "SIGNED=true" >> $GITHUB_ENV
          echo "PROF_UUID=$PROF_UUID" >> $GITHUB_ENV
          echo "PROF_NAME=$PROF_NAME" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "SIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV

          # сверяем bundle id профиля с тем, что собираем
          case "$PROF_APPID" in
            *"${{ env.BUNDLE_ID }}") echo "Bundle ID совпадает с профилем ✓" ;;
            *) echo "::warning::Bundle ID профиля ($PROF_APPID) не совпадает с ${{ env.BUNDLE_ID }}" ;;
          esac

      - name: Build archive
        run: |
          cd ios/App
          LOG=$RUNNER_TEMP/xcodebuild.log
          set +e
          if [ "$SIGNED" = "true" ]; then
            # РУЧНАЯ подпись: автоматическая (-allowProvisioningUpdates) потребовала бы
            # интерактивного входа в Apple ID, которого на раннере нет.
            xcodebuild -workspace App.xcworkspace -scheme App \
              -configuration Release -sdk iphoneos \
              -archivePath $RUNNER_TEMP/Kalon.xcarchive \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              PROVISIONING_PROFILE_SPECIFIER="$PROF_NAME" \
              CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
              archive 2>&1 | tee $LOG
          else
            # без секретов: только проверка компиляции, архив не подписываем
            xcodebuild -workspace App.xcworkspace -scheme App \
              -configuration Release -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
              build 2>&1 | tee $LOG
          fi
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" != "0" ]; then
            echo ""
            echo "═══════════ НАСТОЯЩИЕ ОШИБКИ ═══════════"
            grep -E "^(.*: )?(error|fatal error):" $LOG | sort -u | head -40 || true
            echo "═══════════ последние строки ═══════════"
            tail -40 $LOG
            exit $RC
          fi
          echo "Сборка прошла"

      - name: Export IPA
        if: env.SIGNED == 'true'
        run: |
          PL=$RUNNER_TEMP/ExportOptions.plist
          # пишем plist целиком: teamID и имя профиля обязательны для ручной подписи
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>method</key><string>app-store</string>' \
            '  <key>signingStyle</key><string>manual</string>' \
            "  <key>teamID</key><string>$TEAM_ID</string>" \
            '  <key>uploadSymbols</key><true/>' \
            '  <key>provisioningProfiles</key>' \
            '  <dict>' \
            "    <key>${{ env.BUNDLE_ID }}</key><string>$PROF_NAME</string>" \
            '  </dict>' \
            '</dict>' \
            '</plist>' \
            > $PL
          echo "=== ExportOptions.plist ==="
          cat $PL
          plutil -lint $PL
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Kalon.xcarchive \
            -exportOptionsPlist $PL \
            -exportPath $RUNNER_TEMP/export
          ls -la $RUNNER_TEMP/export

      - name: Upload IPA
        if: env.SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kalon-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload archive (unsigned check)
        if: env.SIGNED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kalon-ios-archive
          path: ${{ runner.temp }}/Kalon.xcarchive

      # ══════════════════════════════════════════════════════════
      # ЗАГРУЗКА В APP STORE CONNECT прямо из облака.
      # Нужны секреты (создаются в App Store Connect → Users and Access → Keys):
      #   ASC_KEY_ID      — идентификатор ключа (10 символов)
      #   ASC_ISSUER_ID   — Issuer ID (длинный UUID со страницы Keys)
      #   ASC_KEY_BASE64  — сам файл .p8 в base64
      # Без них шаг пропускается — IPA просто останется артефактом.
      # ══════════════════════════════════════════════════════════
      - name: Upload to App Store Connect
        if: env.SIGNED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "::notice::Ключи App Store Connect не заданы — IPA остаётся артефактом, загрузи вручную"
            exit 0
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA=$(ls $RUNNER_TEMP/export/*.ipa | head -1)
          echo "Загружаем: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Готово — сборка появится в App Store Connect через 10-30 минут"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain-db 2>/dev/null || true
