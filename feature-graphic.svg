<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11141f"/>
      <stop offset=".55" stop-color="#0b0d16"/>
      <stop offset="1" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="blade" x1="300" y1="90" x2="300" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46e0ff"/>
      <stop offset=".5" stop-color="#5b8bff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#cfd6ff"/>
      <stop offset="1" stop-color="#5b8bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="42%" r="55%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="78%" cy="30%" r="50%">
      <stop offset="0" stop-color="#46e0ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#46e0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>
  <rect width="1024" height="500" fill="url(#glow2)"/>

  <!-- diagonal sheen -->
  <path d="M0 380 L1024 120 L1024 200 L0 460 Z" fill="#ffffff" opacity="0.025"/>

  <!-- decorative macro dots -->
  <circle cx="760" cy="120" r="5" fill="#ff6b8a" opacity=".7"/>
  <circle cx="810" cy="150" r="5" fill="#ffc869" opacity=".7"/>
  <circle cx="860" cy="115" r="5" fill="#46e0ff" opacity=".7"/>

  <!-- ring motif on right -->
  <circle cx="888" cy="300" r="82" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="13"/>
  <circle cx="888" cy="300" r="82" fill="none" stroke="url(#blade)" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="515" stroke-dashoffset="180" transform="rotate(-90 888 300)"/>
  <text x="888" y="295" font-family="Verdana, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">1850</text>
  <text x="888" y="318" font-family="Verdana, sans-serif" font-size="12" fill="#6f7da0" text-anchor="middle" letter-spacing="2">ККАЛ</text>

  <!-- blade icon -->
  <g transform="translate(300 250)">
    <g filter="url(#soft)" opacity="0.5">
      <path d="M0 -160 L44 0 L0 160 L-44 0 Z" fill="#5b8bff"/>
    </g>
    <path d="M0 -160 L44 0 L0 160 L-44 0 Z" fill="url(#blade)"/>
    <path d="M0 -160 L0 160" stroke="#0a0c14" stroke-width="3" opacity=".4"/>
    <path d="M-58 28 L58 28 L40 60 L-40 60 Z" fill="#2a3150"/>
    <rect x="-12" y="60" width="24" height="56" rx="8" fill="#2a3150"/>
    <circle cx="0" cy="126" r="16" fill="#3a4470"/>
    <path d="M0 -150 L34 0 L0 -6 Z" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- title + tagline -->
  <text x="392" y="232" font-family="Verdana, sans-serif" font-size="76" font-weight="bold" fill="url(#title)" letter-spacing="3">KALON</text>
  <text x="394" y="276" font-family="Verdana, sans-serif" font-size="19" fill="#9aa3c4" letter-spacing=".5">Счётчик калорий и дневник питания</text>
  <text x="394" y="305" font-family="Verdana, sans-serif" font-size="19" fill="#9aa3c4" letter-spacing=".5">Считай · отслеживай · достигай</text>
  <text x="394" y="372" font-family="Verdana, sans-serif" font-size="13" fill="#5b6589" letter-spacing="3">SYNAX SWORD AI</text>
</svg>
