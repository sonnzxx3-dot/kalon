<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11141f"/>
      <stop offset="1" stop-color="#070810"/>
    </linearGradient>
    <linearGradient id="blade" x1="256" y1="70" x2="256" y2="442" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46e0ff"/>
      <stop offset=".5" stop-color="#5b8bff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- subtle diagonal sheen -->
  <path d="M0 360 L512 120 L512 200 L0 440 Z" fill="#ffffff" opacity="0.03"/>

  <!-- blade -->
  <g filter="url(#soft)" opacity="0.55">
    <path d="M256 78 L300 256 L256 434 L212 256 Z" fill="#5b8bff"/>
  </g>
  <path d="M256 78 L300 256 L256 434 L212 256 Z" fill="url(#blade)"/>
  <path d="M256 78 L256 434" stroke="#0a0c14" stroke-width="3" opacity=".45"/>

  <!-- crossguard -->
  <path d="M196 300 L316 300 L296 332 L216 332 Z" fill="#2a3150"/>
  <rect x="244" y="332" width="24" height="56" rx="8" fill="#2a3150"/>
  <circle cx="256" cy="398" r="16" fill="#3a4470"/>

  <!-- edge highlight -->
  <path d="M256 88 L292 256 L256 250 Z" fill="#ffffff" opacity="0.25"/>
</svg>
